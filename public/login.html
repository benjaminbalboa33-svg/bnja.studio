<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar | BNJA.STUDIO</title><style>body{margin:0;background:#f7f3ff;font-family:system-ui;color:#201b37;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:30px;border-radius:22px;width:min(390px,90%);box-shadow:0 15px 45px #34215a15}input,button{width:100%;padding:14px;margin:7px 0;border-radius:11px;border:1px solid #ddd;font:inherit;box-sizing:border-box}button{background:#201b37;color:white;font-weight:800;border:0}.err{color:#b42352}</style></head><body><form class="box" id="login"><h1>BNJA.STUDIO</h1><h2>Entrar a mi curso</h2><input name="phone" placeholder="Tu WhatsApp" required><input name="password" type="password" placeholder="Tu contraseña" required><button>Ingresar</button><p class="err" id="err"></p></form><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const f=e.target;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const j=await r.json();if(r.ok)location.href=j.redirect;else document.getElementById('err').textContent=j.error;});</script></body></html>
