<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmando pago | BNJA.STUDIO</title><style>body{font-family:system-ui;background:#f7f3ff;color:#201b37;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:white;border-radius:22px;padding:30px;width:min(440px,90%);text-align:center;box-shadow:0 15px 45px #34215a15}.muted{color:#706a80;line-height:1.5}</style></head><body><div class="box"><h1>¡Gracias por tu compra!</h1><h2>Estamos confirmando tu pago…</h2><p class="muted" id="msg">Mercado Pago puede tardar unos instantes en avisarnos. No cierres esta página.</p></div><script>const q=new URLSearchParams(location.search),order=q.get('order'),claim=q.get('claim'),msg=document.getElementById('msg');let tries=0;async function check(){if(!order||!claim){msg.textContent='No encontramos los datos de esta compra. Si pagaste, volvé a ingresar con tu WhatsApp y contraseña.';return;}try{const r=await fetch('/api/orders/'+encodeURIComponent(order)+'/status');const j=await r.json();if(j.status==='paid'){const c=await fetch('/api/orders/'+encodeURIComponent(order)+'/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({claim})});if(c.ok){location.replace('/curso');return;}msg.textContent='El acceso ya fue utilizado o necesitás ingresar desde la página de acceso.';return;}}catch(e){}tries++;if(tries<40){msg.textContent='Esperando confirmación de Mercado Pago… ('+tries+'/40)';setTimeout(check,3000);}else{msg.textContent='Todavía no recibimos la confirmación. Podés entrar más tarde desde “Ingresar” usando tu WhatsApp y contraseña. Si el pago fue aprobado, tu cuenta se habilitará automáticamente.';}}</script></body></html>
